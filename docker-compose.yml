version: "3.8"

services:
  # 1. Base de Datos (SmarterOS Unified DB)
  db:
    image: ankane/pgvector:latest
    container_name: smarteros-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
    volumes:
      - ./database/unified_schema.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres_data:/var/lib/postgresql/data

  # 2. n8n - El motor de automatización
  n8n:
    image: n8nio/n8n:latest
    container_name: smarteros-n8n
    ports:
      - "5678:5678"
    environment:
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=db
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=postgres
      - DB_POSTGRESDB_USER=postgres
      - DB_POSTGRESDB_PASSWORD=postgres_password
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=password
    depends_on:
      - db
    volumes:
      - .n8n_data:/home/node/.n8n

  # 3. FastAPI Orchestrator (Backend API)
  # Recibe llamadas de n8n y orquesta con MCP
  api-backend:
    build: ./services/orchestrator
    container_name: smarteros-orchestrator
    restart: always
    ports:
      - "8080:8000"
    environment:
      - MCP_API_URL=http://mcp-server:8000
      - DATABASE_URL=postgresql://postgres:postgres_password@db:5432/postgres
      - JWT_SECRET=smarter_secret_2026
    depends_on:
      - db
      - mcp-server

  # 4. SmarterMCP Server (HTTP Interface for Tools)
  mcp-server:
    build: ./services/mcp-server
    container_name: smarteros-mcp
    restart: always
    ports:
      - "8001:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres_password@db:5432/postgres
    depends_on:
      - db

volumes:
  postgres_data:
  .n8n_data:
