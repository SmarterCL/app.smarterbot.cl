services:
  # 1. Base de Datos (SmarterOS Unified DB)
  db:
    image: ankane/pgvector:latest
    container_name: smarteros-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    volumes:
      - ./database/unified_schema.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres_data:/var/lib/postgresql/data
    secrets:
      - postgres_password

  # 2. n8n - El motor de automatización
  n8n:
    image: n8nio/n8n:latest
    container_name: smarteros-n8n
    ports:
      - "5678:5678"
    environment:
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=db
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=postgres
      - DB_POSTGRESDB_USER=postgres
      - DB_POSTGRESDB_PASSWORD_FILE=/run/secrets/postgres_password
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD_FILE=/run/secrets/n8n_password
    depends_on:
      - db
    volumes:
      - .n8n_data:/home/node/.n8n
    secrets:
      - postgres_password
      - n8n_password

  # 3. FastAPI Orchestrator (Backend API)
  # Recibe llamadas de n8n y orquesta con MCP
  api-backend:
    build: ./services/orchestrator
    container_name: smarteros-orchestrator
    restart: always
    ports:
      - "8080:8000"
    environment:
      - MCP_API_URL=http://mcp-server:8000
      - DATABASE_URL_FILE=/run/secrets/database_url
      - JWT_SECRET_FILE=/run/secrets/jwt_secret
    depends_on:
      - db
      - mcp-server
    secrets:
      - jwt_secret
      - database_url

  # 4. SmarterMCP Server (HTTP Interface for Tools)
  mcp-server:
    build: ./services/mcp-server
    container_name: smarteros-mcp
    restart: always
    ports:
      - "8001:8000"
    environment:
      - DATABASE_URL_FILE=/run/secrets/database_url
    depends_on:
      - db
    secrets:
      - database_url

  # 5. SmarterOS Frontend (Next.js App)
  frontend:
    build:
      context: .
      args:
        - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
        - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        - NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
        - CLERK_SECRET_KEY=${CLERK_SECRET_KEY}
        - NEXT_PUBLIC_CLERK_SIGN_IN_URL=/auth/sign-in
        - NEXT_PUBLIC_CLERK_SIGN_UP_URL=/auth/sign-up
        - NEXT_PUBLIC_CLERK_AFTER_SIGN_IN_URL=/dashboard
        - NEXT_PUBLIC_CLERK_AFTER_SIGN_UP_URL=/dashboard
    container_name: smarteros-frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      - NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
      - CLERK_SECRET_KEY=${CLERK_SECRET_KEY}
      - NEXT_PUBLIC_CLERK_SIGN_IN_URL=/auth/sign-in
      - NEXT_PUBLIC_CLERK_SIGN_UP_URL=/auth/sign-up
      - NEXT_PUBLIC_CLERK_AFTER_SIGN_IN_URL=/dashboard
      - NEXT_PUBLIC_CLERK_AFTER_SIGN_UP_URL=/dashboard
      - FASTAPI_URL=http://api-backend:8000
    depends_on:
      - db
      - api-backend

secrets:
  postgres_password:
    file: ./secrets/postgres_password
  n8n_password:
    file: ./secrets/n8n_password
  jwt_secret:
    file: ./secrets/jwt_secret
  database_url:
    file: ./secrets/database_url

volumes:
  postgres_data:
  .n8n_data:
